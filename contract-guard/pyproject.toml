[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-guard"
version = "0.1.0"
description = "Deterministic OpenAPI contract compatibility checker"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "flask>=3.0",
]

[project.scripts]
contract-guard = "contract_guard.__main__:main"
contract-guard-mcp = "contract_guard.mcp_server:main"
contract-guard-ui = "contract_guard.web_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
